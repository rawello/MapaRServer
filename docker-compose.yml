services:
  maparServer:
    image: rawello/maparServer:latest
    container_name: maparServer
    restart: unless-stopped
    ports:
      - "8001:8084"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5430/mapardb
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: 123321

      SERVER_PORT: 8084
    depends_on:
      - postgres
    networks:
      - app-network

  postgres:
    image: postgres:17-bookworm
    container_name: postgres_mapar
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 123321
      POSTGRES_DB: masterdb
      POSTGRES_MULTIPLE_DATABASES: "mapardb"
    volumes:
      - postgres_data:/var/lib/postgresql17/datadir_prod
    ports:
      - "5430:5432"
    networks:
      - app-network
    command: ["postgres", "-c", "max_connections=1000"]

volumes:
  postgres_data:

networks:
  app-network:
    driver: bridge
    driver_opts:
      com.docker.network.driver.mtu: 1450
