<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Nodes Viewer</title>
    <script type="importmap">
        {
          "imports": {
            "three": "https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.module.js",
            "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.128.0/examples/jsm/"
          }
        }
    </script>
    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
        import { TransformControls } from 'three/addons/controls/TransformControls.js';

        let nodes = [];
        let buildings = [];
        let scene, camera, renderer;
        let selectedNodeMesh = null;
        let controls, transformControls;
        let raycaster, mouse;
        let gridHelper;
        let lines = [];
        let hitboxes = [];

        async function fetchBuildings() {
            try {
                const response = await fetch('/api/buildings', {
                    headers: {
                        'Authorization': `Bearer ${localStorage.getItem('token')}`
                    }
                });
                if (!response.ok) {
                    throw new Error('Network response was not ok ' + response.statusText);
                }
                buildings = await response.json();
                console.log('Buildings loaded:', buildings);
                return buildings;
            } catch (error) {
                console.error('Failed to fetch buildings:', error);
                throw error;
            }
        }

        async function fetchNodesForBuilding(buildingId) {
            try {
                const response = await fetch(`/api/buildings/${buildingId}/nodes`, {
                    headers: {
                        'Authorization': `Bearer ${localStorage.getItem('token')}`
                    }
                });
                if (!response.ok) {
                    throw new Error('Network response was not ok ' + response.statusText);
                }
                nodes = await response.json();
                console.log('Nodes loaded:', nodes);
                return nodes;
            } catch (error) {
                console.error('Failed to fetch nodes:', error);
                throw error;
            }
        }

        function clearScene() {
            scene.children.forEach(child => {
                if (child !== gridHelper && child !== transformControls) {
                    scene.remove(child);
                }
            });
            lines = [];
            hitboxes = [];
        }

        function renderNodes(nodes) {
            if (!nodes || nodes.length === 0) {
                console.warn('No nodes to render');
                return;
            }

            nodes.forEach(node => {
                const position = node.translation.split(',').map(parseFloat);
                const geometry = new THREE.BoxGeometry(0.3, 0.3, 0.3);
                const material = new THREE.MeshBasicMaterial({ color: 0x00ff00 });
                const cube = new THREE.Mesh(geometry, material);
                cube.position.set(position[0], position[1], position[2]);
                cube.userData = node;
                scene.add(cube);

                const hitboxGeometry = new THREE.BoxGeometry(0.5, 0.5, 0.5);
                const hitboxMaterial = new THREE.MeshBasicMaterial({ color: 0x00ff00, visible: false });
                const hitbox = new THREE.Mesh(hitboxGeometry, hitboxMaterial);
                hitbox.position.set(position[0], position[1], position[2]);
                hitbox.userData = node;
                scene.add(hitbox);
                hitboxes.push(hitbox);

                const neighbors = node.neighbors.split(',').map(Number);
                neighbors.forEach(neighborId => {
                    const neighborNode = nodes.find(n => n.id === neighborId);
                    if (neighborNode) {
                        const neighborPosition = neighborNode.translation.split(',').map(parseFloat);
                        const lineGeometry = new THREE.BufferGeometry().setFromPoints([
                            new THREE.Vector3(...position),
                            new THREE.Vector3(...neighborPosition)
                        ]);
                        const lineMaterial = new THREE.LineBasicMaterial({ color: 0x0000ff });
                        const line = new THREE.Line(lineGeometry, lineMaterial);
                        scene.add(line);
                        lines.push(line);

                        console.log(`Created line from node ${node.id} to node ${neighborId}`);
                    }
                });
            });
        }

        async function init() {
            try {
                scene = new THREE.Scene();
                camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
                renderer = new THREE.WebGLRenderer();
                renderer.setSize(window.innerWidth, window.innerHeight);
                document.body.appendChild(renderer.domElement);

                controls = new OrbitControls(camera, renderer.domElement);
                controls.minDistance = 0;
                controls.maxDistance = 150;
                controls.update();

                transformControls = new TransformControls(camera, renderer.domElement);
                scene.add(transformControls);

                transformControls.addEventListener('change', () => {
                    if (selectedNodeMesh) {
                        const position = selectedNodeMesh.position;
                        document.getElementById('nodeX').value = position.x.toFixed(2);
                        document.getElementById('nodeY').value = position.y.toFixed(2);
                        document.getElementById('nodeZ').value = position.z.toFixed(2);
                        updateLines(selectedNodeMesh);
                    }
                });

                transformControls.addEventListener('dragging-changed', event => {
                    controls.enabled = !event.value;
                });

                raycaster = new THREE.Raycaster();
                mouse = new THREE.Vector2();

                window.addEventListener('click', onMouseClick, false);

                gridHelper = new THREE.GridHelper(100, 100);
                gridHelper.position.set(0, -2, 0);
                scene.add(gridHelper);

                buildings = await fetchBuildings();
                const buildingIdSelect = document.getElementById('buildingId');
                buildings.forEach(building => {
                    const option = document.createElement('option');
                    option.value = building.id;
                    option.textContent = building.name;
                    buildingIdSelect.appendChild(option);
                });

                loadNodesForBuilding();
                animate();
            } catch (error) {
                console.error('Initialization failed:', error);
                showLoginModal();
            }
        }

        async function loadNodesForBuilding() {
            try {
                const buildingId = document.getElementById('buildingId').value;
                nodes = await fetchNodesForBuilding(buildingId);
                clearScene();
                renderNodes(nodes);

                const nodeIdSelect = document.getElementById('nodeId');
                nodeIdSelect.innerHTML = '';
                nodes.forEach(node => {
                    const option = document.createElement('option');
                    option.value = node.id;
                    option.textContent = node.id;
                    nodeIdSelect.appendChild(option);
                });

                highlightSelectedNode();

                // Приблизить камеру к первой точке
                if (nodes.length > 0) {
                    const firstNodePosition = nodes[0].translation.split(',').map(parseFloat);
                    camera.position.set(firstNodePosition[0], firstNodePosition[1], firstNodePosition[2] + 20);
                    camera.lookAt(firstNodePosition[0], firstNodePosition[1], firstNodePosition[2]);
                    controls.target.set(firstNodePosition[0], firstNodePosition[1], firstNodePosition[2]);
                }
            } catch (error) {
                console.error('Failed to load nodes for building:', error);
                showLoginModal();
            }
        }

        function highlightSelectedNode() {
            if (selectedNodeMesh) {
                selectedNodeMesh.material.color.set(0x00ff00);
                transformControls.detach();
            }

            const nodeId = document.getElementById('nodeId').value;
            const selectedNode = nodes.find(node => node.id == nodeId);
            if (selectedNode) {
                document.getElementById('nodeName').value = selectedNode.name;
                document.getElementById('nodeNeighbors').value = selectedNode.neighbors;

                const nodeCoordinatesSpan = document.getElementById('nodeCoordinates');
                nodeCoordinatesSpan.textContent = selectedNode.translation;

                selectedNodeMesh = scene.children.find(child => child.userData.id == nodeId);
                if (selectedNodeMesh) {
                    selectedNodeMesh.material.color.set(0xff0000);
                    transformControls.attach(selectedNodeMesh);
                }
            }
        }

        function animate() {
            requestAnimationFrame(animate);
            controls.update();
            renderer.render(scene, camera);
        }

        function updateNode() {
            const nodeId = document.getElementById('nodeId').value;
            const nodeName = document.getElementById('nodeName').value;
            const nodeNeighbors = document.getElementById('nodeNeighbors').value;
            const nodeX = document.getElementById('nodeX').value;
            const nodeY = document.getElementById('nodeY').value;
            const nodeZ = document.getElementById('nodeZ').value;

            const nodeToUpdate = nodes.find(node => node.id == nodeId);
            if (nodeToUpdate) {
                nodeToUpdate.name = nodeName;
                nodeToUpdate.neighbors = nodeNeighbors;
                nodeToUpdate.translation = `${nodeX},${nodeY},${nodeZ}`;

                const buildingId = document.getElementById('buildingId').value;
                fetch(`/api/building-nodes/${buildingId}/${nodeId}`, {
                    method: 'PUT',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${localStorage.getItem('token')}`
                    },
                    body: JSON.stringify(nodeToUpdate)
                }).then(response => {
                    if (response.ok) {
                        alert('Node updated successfully');
                    } else {
                        alert('Failed to update node');
                    }
                });
            }
        }

        function deleteNode() {
            const nodeId = document.getElementById('nodeId').value;
            if (nodeId) {
                const buildingId = document.getElementById('buildingId').value;
                fetch(`/api/building-nodes/${buildingId}/${nodeId}`, {
                    method: 'DELETE',
                    headers: {
                        'Authorization': `Bearer ${localStorage.getItem('token')}`
                    }
                }).then(response => {
                    if (response.ok) {
                        alert('Node deleted successfully');
                        loadNodesForBuilding();
                    } else {
                        alert('Failed to delete node');
                    }
                });
            }
        }

        function createNode() {
            const buildingId = document.getElementById('buildingId').value;
            const nodeName = document.getElementById('newNodeName').value;
            const nodeNeighbors = document.getElementById('newNodeNeighbors').value;
            const nodeX = document.getElementById('newNodeX').value;
            const nodeY = document.getElementById('newNodeY').value;
            const nodeZ = document.getElementById('newNodeZ').value;

            const newNode = {
                buildingId: buildingId,
                name: nodeName,
                neighbors: nodeNeighbors,
                translation: `${nodeX},${nodeY},${nodeZ}`
            };

            fetch('/api/nodes', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'Authorization': `Bearer ${localStorage.getItem('token')}`
                },
                body: JSON.stringify(newNode)
            }).then(response => {
                if (response.ok) {
                    alert('Node created successfully');
                    loadNodesForBuilding();
                } else {
                    alert('Failed to create node');
                }
            });
        }

        function onMouseClick(event) {
            mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;

            raycaster.setFromCamera(mouse, camera);
            const intersects = raycaster.intersectObjects(hitboxes, true);

            if (intersects.length > 0) {
                const selectedObject = intersects[0].object;
                if (selectedObject.userData && selectedObject.userData.id) {
                    document.getElementById('nodeId').value = selectedObject.userData.id;
                    highlightSelectedNode();
                }
            } else {
                if (selectedNodeMesh) {
                    selectedNodeMesh.material.color.set(0x00ff00);
                    transformControls.detach();
                    selectedNodeMesh = null;
                    document.getElementById('nodeId').value = '';
                }
            }
        }

        function updateLines(nodeMesh) {
            const nodeId = nodeMesh.userData.id;
            const nodePosition = nodeMesh.position.clone();
            const neighbors = nodeMesh.userData.neighbors.split(',').map(Number);

            lines.forEach(line => {
                const points = line.geometry.attributes.position.array;
                if (
                    (points[0] === nodePosition.x && points[1] === nodePosition.y && points[2] === nodePosition.z) ||
                    (points[3] === nodePosition.x && points[4] === nodePosition.y && points[5] === nodePosition.z)
                ) {
                    const otherNode = nodes.find(n => n.id === neighbors[0]);
                    if (otherNode) {
                        const otherPosition = new THREE.Vector3().fromArray(otherNode.translation.split(',').map(parseFloat));
                        line.geometry.setFromPoints([nodePosition, otherPosition]);
                    }
                }
            });
        }

        document.getElementById('buildingId').addEventListener('change', loadNodesForBuilding);
        document.getElementById('nodeId').addEventListener('change', highlightSelectedNode);
        document.getElementById('updateNode').addEventListener('click', updateNode);
        document.getElementById('deleteNode').addEventListener('click', deleteNode);
        document.getElementById('createNode').addEventListener('click', createNode);

        // Проверка токена при запуске
        (async function() {
            const token = localStorage.getItem('token');
            if (!token || !await validateToken(token)) {
                showLoginModal();
            } else {
                init();
            }
        })();
    </script>
    <style>
        body {
            margin: 0;
            background: black;
        }

        canvas {
            display: block;
        }

        #controls {
            position: absolute;
            top: 10px;
            left: 10px;
            background: white;
            padding: 10px;
        }

        #nodeInfo {
            position: absolute;
            top: 10px;
            right: 10px;
            background: white;
            padding: 10px;
        }

        #loginModal {
            display: none;
            position: fixed;
            z-index: 1;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            overflow: auto;
            background-color: rgba(0, 0, 0, 0.4);
        }

        #loginModalContent {
            background-color: #fefefe;
            margin: 15% auto;
            padding: 20px;
            border: 1px solid #888;
            width: 30%;
        }

        #loginModalContent button {
            margin: 10px;
        }

        .tab {
            overflow: hidden;
            border: 1px solid #ccc;
            background-color: #f1f1f1;
        }

        .tab button {
            background-color: inherit;
            float: left;
            border: none;
            outline: none;
            cursor: pointer;
            padding: 14px 16px;
            transition: 0.3s;
        }

        .tab button:hover {
            background-color: #ddd;
        }

        .tab button.active {
            background-color: #ccc;
        }

        .tabcontent {
            display: none;
            padding: 6px 12px;
            border: 1px solid #ccc;
            border-top: none;
        }
    </style>
</head>

<body>
<div id="controls">
    <h3>Edit Node</h3>
    <div>
        <label for="buildingId">Building:</label>
        <select id="buildingId"></select>
    </div>
    <div>
        <label for="nodeId">Node ID:</label>
        <select id="nodeId"></select>
    </div>
    <div>
        <label for="nodeName">Name:</label>
        <input type="text" id="nodeName">
    </div>
    <div>
        <label for="nodeNeighbors">Neighbors:</label>
        <input type="text" id="nodeNeighbors">
    </div>
    <div>
        <label for="nodeX">X:</label>
        <input type="number" id="nodeX" step="0.1">
    </div>
    <div>
        <label for="nodeY">Y:</label>
        <input type="number" id="nodeY" step="0.1">
    </div>
    <div>
        <label for="nodeZ">Z:</label>
        <input type="number" id="nodeZ" step="0.1">
    </div>
    <button id="updateNode">Update Node</button>
    <button id="deleteNode">Delete Node</button>
    <h3>Create Node</h3>
    <div>
        <label for="newNodeName">Name:</label>
        <input type="text" id="newNodeName">
    </div>
    <div>
        <label for="newNodeNeighbors">Neighbors:</label>
        <input type="text" id="newNodeNeighbors">
    </div>
    <div>
        <label for="newNodeX">X:</label>
        <input type="number" id="newNodeX" step="0.1">
    </div>
    <div>
        <label for="newNodeY">Y:</label>
        <input type="number" id="newNodeY" step="0.1">
    </div>
    <div>
        <label for="newNodeZ">Z:</label>
        <input type="number" id="newNodeZ" step="0.1">
    </div>
    <button id="createNode">Create Node</button>
</div>
<div id="nodeInfo">
    <h3>Node Info</h3>
    <div>
        <label for="nodeCoordinates">Coordinates:</label>
        <span id="nodeCoordinates"></span>
    </div>
</div>

<div id="loginModal">
    <div id="loginModalContent">
        <div class="tab">
            <button class="tablinks" onclick="openTab(event, 'login')">Login</button>
            <button class="tablinks" onclick="openTab(event, 'register')">Register</button>
        </div>

        <div id="login" class="tabcontent">
            <h2>Please Login</h2>
            <form id="loginForm">
                <label for="loginUsername">Username:</label>
                <input type="text" id="loginUsername" name="username"><br>
                <label for="loginPassword">Password:</label>
                <input type="password" id="loginPassword" name="password"><br>
                <button type="submit">Login</button>
            </form>
        </div>

        <div id="register" class="tabcontent">
            <h2>Please Register</h2>
            <form id="registerForm">
                <label for="registerUsername">Username:</label>
                <input type="text" id="registerUsername" name="username"><br>
                <label for="registerPassword">Password:</label>
                <input type="password" id="registerPassword" name="password"><br>
                <button type="submit">Register</button>
            </form>
        </div>
    </div>
</div>

<script>
    async function validateToken(token) {
        try {
            const response = await fetch('/api/auth/validate', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'Authorization': `Bearer ${token}`
                }
            });
            return response.ok;
        } catch (error) {
            console.error('Token validation failed:', error);
            return false;
        }
    }

    function showLoginModal() {
        document.getElementById('loginModal').style.display = 'block';
        openTab(event, 'login');
    }

    function hideLoginModal() {
        document.getElementById('loginModal').style.display = 'none';
    }

    document.getElementById('loginForm').addEventListener('submit', async function(event) {
        event.preventDefault();
        const username = document.getElementById('loginUsername').value;
        const password = document.getElementById('loginPassword').value;

        try {
            const response = await fetch('/api/auth/login', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({ username, password })
            });
            if (!response.ok) {
                throw new Error('Network response was not ok ' + response.statusText);
            }
            const data = await response.json();
            localStorage.setItem('token', data.token);
            hideLoginModal();
            location.reload(); // Перезагрузка страницы после логина
        } catch (error) {
            alert('Login failed: ' + error.message);
        }
    });

    document.getElementById('registerForm').addEventListener('submit', async function(event) {
        event.preventDefault();
        const username = document.getElementById('registerUsername').value;
        const password = document.getElementById('registerPassword').value;

        try {
            const response = await fetch('/api/auth/register', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({ username, password })
            });
            if (!response.ok) {
                throw new Error('Network response was not ok ' + response.statusText);
            }
            alert('Registration successful');
            hideLoginModal();
            location.reload(); // Перезагрузка страницы после регистрации
        } catch (error) {
            alert('Registration failed: ' + error.message);
        }
    });

    function openTab(evt, tabName) {
        var i, tabcontent, tablinks;
        tabcontent = document.getElementsByClassName("tabcontent");
        for (i = 0; i < tabcontent.length; i++) {
            tabcontent[i].style.display = "none";
        }
        tablinks = document.getElementsByClassName("tablinks");
        for (i = 0; i < tablinks.length; i++) {
            tablinks[i].className = tablinks[i].className.replace(" active", "");
        }
        document.getElementById(tabName).style.display = "block";
        evt.currentTarget.className += " active";
    }
</script>
</body>

</html>
