<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Nodes Viewer</title>
    <script type="importmap">
        {
          "imports": {
            "three": "https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.module.js",
            "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.128.0/examples/jsm/"
          }
        }
    </script>
    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
        import { TransformControls } from 'three/addons/controls/TransformControls.js';

        let nodes = [];
        let buildings = [];
        let scene, camera, renderer;
        let selectedNodeMesh = null;
        let controls, transformControls;
        let raycaster, mouse;
        let gridHelper;
        let lines = [];
        let hitboxes = [];

        async function fetchBuildings() {
            try {
                const response = await fetch('/api/buildings');
                if (!response.ok) {
                    throw new Error('Network response was not ok ' + response.statusText);
                }
                buildings = await response.json();
                console.log('Buildings loaded:', buildings);
                return buildings;
            } catch (error) {
                console.error('Failed to fetch buildings:', error);
            }
        }

        async function fetchNodesForBuilding(buildingId) {
            try {
                const response = await fetch(`/api/nodes?buildingId=${buildingId}`);
                if (!response.ok) {
                    throw new Error('Network response was not ok ' + response.statusText);
                }
                nodes = await response.json();
                console.log('Nodes loaded:', nodes);
                return nodes;
            } catch (error) {
                console.error('Failed to fetch nodes:', error);
            }
        }

        function clearScene() {
            scene.children.forEach(child => {
                if (child !== gridHelper && child !== transformControls) {
                    scene.remove(child);
                }
            });
            lines = [];
            hitboxes = [];
        }

        function renderNodes(nodes) {
            nodes.forEach(node => {
                const position = node.translation.split(',').map(parseFloat);
                const geometry = new THREE.BoxGeometry(0.1, 0.1, 0.1);
                const material = new THREE.MeshBasicMaterial({ color: 0x00ff00 });
                const cube = new THREE.Mesh(geometry, material);
                cube.position.set(position[0], position[1], position[2]);
                cube.userData = node;
                scene.add(cube);

                const hitboxGeometry = new THREE.SphereGeometry(0.5, 32, 32);
                const hitboxMaterial = new THREE.MeshBasicMaterial({ color: 0x00ff00, visible: false });
                const hitbox = new THREE.Mesh(hitboxGeometry, hitboxMaterial);
                hitbox.position.set(position[0], position[1], position[2]);
                hitbox.userData = node;
                scene.add(hitbox);
                hitboxes.push(hitbox);

                const neighbors = node.neighbors.split(',').map(Number);
                neighbors.forEach(neighborId => {
                    const neighborNode = nodes.find(n => n.id === neighborId);
                    if (neighborNode) {
                        const neighborPosition = neighborNode.translation.split(',').map(parseFloat);
                        const lineGeometry = new THREE.BufferGeometry().setFromPoints([
                            new THREE.Vector3(...position),
                            new THREE.Vector3(...neighborPosition)
                        ]);
                        const lineMaterial = new THREE.LineBasicMaterial({ color: 0x0000ff });
                        const line = new THREE.Line(lineGeometry, lineMaterial);
                        scene.add(line);
                        lines.push(line);
                    }
                });
            });
        }

        async function init() {
            scene = new THREE.Scene();
            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
            renderer = new THREE.WebGLRenderer();
            renderer.setSize(window.innerWidth, window.innerHeight);
            document.body.appendChild(renderer.domElement);
            camera.position.set(0, 20, 100);

            controls = new OrbitControls(camera, renderer.domElement);
            controls.update();

            transformControls = new TransformControls(camera, renderer.domElement);
            scene.add(transformControls);

            transformControls.addEventListener('change', () => {
                if (selectedNodeMesh) {
                    const position = selectedNodeMesh.position;
                    document.getElementById('nodeX').value = position.x.toFixed(2);
                    document.getElementById('nodeY').value = position.y.toFixed(2);
                    document.getElementById('nodeZ').value = position.z.toFixed(2);
                    updateLines(selectedNodeMesh);
                }
            });

            transformControls.addEventListener('dragging-changed', event => {
                controls.enabled = !event.value;
            });

            raycaster = new THREE.Raycaster();
            mouse = new THREE.Vector2();

            window.addEventListener('click', onMouseClick, false);

            gridHelper = new THREE.GridHelper(100, 100);
            scene.add(gridHelper);

            buildings = await fetchBuildings();
            const buildingIdSelect = document.getElementById('buildingId');
            buildings.forEach(building => {
                const option = document.createElement('option');
                option.value = building.id;
                option.textContent = building.name;
                buildingIdSelect.appendChild(option);
            });

            loadNodesForBuilding();
            animate();
        }

        async function loadNodesForBuilding() {
            const buildingId = document.getElementById('buildingId').value;
            nodes = await fetchNodesForBuilding(buildingId);
            clearScene();
            renderNodes(nodes);

            const nodeIdSelect = document.getElementById('nodeId');
            nodeIdSelect.innerHTML = '';
            nodes.forEach(node => {
                const option = document.createElement('option');
                option.value = node.id;
                option.textContent = node.id;
                nodeIdSelect.appendChild(option);
            });

            highlightSelectedNode();
        }

        function highlightSelectedNode() {
            if (selectedNodeMesh) {
                selectedNodeMesh.material.color.set(0x00ff00);
                transformControls.detach();
            }

            const nodeId = document.getElementById('nodeId').value;
            const selectedNode = nodes.find(node => node.id == nodeId);
            if (selectedNode) {
                document.getElementById('nodeName').value = selectedNode.name;
                document.getElementById('nodeNeighbors').value = selectedNode.neighbors;

                const nodeCoordinatesSpan = document.getElementById('nodeCoordinates');
                nodeCoordinatesSpan.textContent = selectedNode.translation;

                selectedNodeMesh = scene.children.find(child => child.userData.id == nodeId);
                if (selectedNodeMesh) {
                    selectedNodeMesh.material.color.set(0xff0000);
                    transformControls.attach(selectedNodeMesh);
                }
            }
        }

        function animate() {
            requestAnimationFrame(animate);
            controls.update();
            renderer.render(scene, camera);
        }

        function updateNode() {
            const nodeId = document.getElementById('nodeId').value;
            const nodeName = document.getElementById('nodeName').value;
            const nodeNeighbors = document.getElementById('nodeNeighbors').value;
            const nodeX = document.getElementById('nodeX').value;
            const nodeY = document.getElementById('nodeY').value;
            const nodeZ = document.getElementById('nodeZ').value;

            const nodeToUpdate = nodes.find(node => node.id == nodeId);
            if (nodeToUpdate) {
                nodeToUpdate.name = nodeName;
                nodeToUpdate.neighbors = nodeNeighbors;
                nodeToUpdate.translation = `${nodeX},${nodeY},${nodeZ}`;

                fetch(`/api/nodes/${nodeId}`, {
                    method: 'PUT',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(nodeToUpdate)
                }).then(response => {
                    if (response.ok) {
                        alert('Node updated successfully');
                    } else {
                        alert('Failed to update node');
                    }
                });
            }
        }

        function deleteNode() {
            const nodeId = document.getElementById('nodeId').value;
            if (nodeId) {
                fetch(`/api/nodes/${nodeId}`, {
                    method: 'DELETE'
                }).then(response => {
                    if (response.ok) {
                        alert('Node deleted successfully');
                        loadNodesForBuilding();
                    } else {
                        alert('Failed to delete node');
                    }
                });
            }
        }

        function createNode() {
            const buildingId = document.getElementById('buildingId').value;
            const nodeName = document.getElementById('newNodeName').value;
            const nodeNeighbors = document.getElementById('newNodeNeighbors').value;
            const nodeX = document.getElementById('newNodeX').value;
            const nodeY = document.getElementById('newNodeY').value;
            const nodeZ = document.getElementById('newNodeZ').value;

            const newNode = {
                buildingId: buildingId,
                name: nodeName,
                neighbors: nodeNeighbors,
                translation: `${nodeX},${nodeY},${nodeZ}`
            };

            fetch('/api/nodes', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify(newNode)
            }).then(response => {
                if (response.ok) {
                    alert('Node created successfully');
                    loadNodesForBuilding();
                } else {
                    alert('Failed to create node');
                }
            });
        }

        function onMouseClick(event) {
            mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;

            raycaster.setFromCamera(mouse, camera);
            const intersects = raycaster.intersectObjects(hitboxes, true);

            if (intersects.length > 0) {
                const selectedObject = intersects[0].object;
                if (selectedObject.userData && selectedObject.userData.id) {
                    document.getElementById('nodeId').value = selectedObject.userData.id;
                    highlightSelectedNode();
                }
            } else {
                if (selectedNodeMesh) {
                    selectedNodeMesh.material.color.set(0x00ff00);
                    transformControls.detach();
                    selectedNodeMesh = null;
                    document.getElementById('nodeId').value = '';
                }
            }
        }

        function updateLines(nodeMesh) {
            const nodeId = nodeMesh.userData.id;
            const nodePosition = nodeMesh.position;
            const neighbors = nodeMesh.userData.neighbors.split(',').map(Number);

            neighbors.forEach(neighborId => {
                const neighborNode = nodes.find(n => n.id === neighborId);
                if (neighborNode) {
                    const neighborPosition = neighborNode.translation.split(',').map(parseFloat);
                    const line = lines.find(line => {
                        const points = line.geometry.attributes.position.array;
                        return (points[0] === nodePosition.x && points[1] === nodePosition.y && points[2] === nodePosition.z) ||
                               (points[3] === nodePosition.x && points[4] === nodePosition.y && points[5] === nodePosition.z);
                    });

                    if (line) {
                        line.geometry.setFromPoints([
                            new THREE.Vector3(...nodePosition.toArray()),
                            new THREE.Vector3(...neighborPosition)
                        ]);
                    }
                }
            });
        }

        document.getElementById('buildingId').addEventListener('change', loadNodesForBuilding);
        document.getElementById('nodeId').addEventListener('change', highlightSelectedNode);
        document.getElementById('updateNode').addEventListener('click', updateNode);
        document.getElementById('deleteNode').addEventListener('click', deleteNode);
        document.getElementById('createNode').addEventListener('click', createNode);

        init();
    </script>
    <style>
        body { margin: 0; background: black; }
        canvas { display: block; }
        #controls { position: absolute; top: 10px; left: 10px; background: white; padding: 10px; }
        #nodeInfo { position: absolute; top: 10px; right: 10px; background: white; padding: 10px; }
    </style>
</head>
<body>
<div id="controls">
    <h3>Edit Node</h3>
    <div>
        <label for="buildingId">Building:</label>
        <select id="buildingId"></select>
    </div>
    <div>
        <label for="nodeId">Node ID:</label>
        <select id="nodeId"></select>
    </div>
    <div>
        <label for="nodeName">Name:</label>
        <input type="text" id="nodeName">
    </div>
    <div>
        <label for="nodeNeighbors">Neighbors:</label>
        <input type="text" id="nodeNeighbors">
    </div>
    <div>
        <label for="nodeX">X:</label>
        <input type="number" id="nodeX" step="0.1">
    </div>
    <div>
        <label for="nodeY">Y:</label>
        <input type="number" id="nodeY" step="0.1">
    </div>
    <div>
        <label for="nodeZ">Z:</label>
        <input type="number" id="nodeZ" step="0.1">
    </div>
    <button id="updateNode">Update Node</button>
    <button id="deleteNode">Delete Node</button>
    <h3>Create Node</h3>
    <div>
        <label for="newNodeName">Name:</label>
        <input type="text" id="newNodeName">
    </div>
    <div>
        <label for="newNodeNeighbors">Neighbors:</label>
        <input type="text" id="newNodeNeighbors">
    </div>
    <div>
        <label for="newNodeX">X:</label>
        <input type="number" id="newNodeX" step="0.1">
    </div>
    <div>
        <label for="newNodeY">Y:</label>
        <input type="number" id="newNodeY" step="0.1">
    </div>
    <div>
        <label for="newNodeZ">Z:</label>
        <input type="number" id="newNodeZ" step="0.1">
    </div>
    <button id="createNode">Create Node</button>
</div>
<div id="nodeInfo">
    <h3>Node Info</h3>
    <div>
        <label for="nodeCoordinates">Coordinates:</label>
        <span id="nodeCoordinates"></span>
    </div>
</div>
</body>
</html>
